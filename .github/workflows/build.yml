name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  # The Windows-only code (ICMP, route tracing, adapter details, TCP counters)
  # on a real Windows machine, then one short test against Cloudflare.
  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -v ./...
      - name: Live test with the command-line mode
        continue-on-error: true
        shell: pwsh
        run: |
          go build -o st.exe .
          ./st.exe -run -seconds 5 -data $env:RUNNER_TEMP
          ./st.exe -run -json -seconds 5 -data $env:RUNNER_TEMP | Out-File result.json
          $r = Get-Content result.json | ConvertFrom-Json
          "probe method: $($r.probeMethod); hops: $($r.route.Count); adapter: $($r.adapter.kind) $($r.adapter.linkDownMbps) Mbps; local TCP: $($r.tcp.ratePct)"
      - name: Compare with M-Lab NDT7
        continue-on-error: true
        shell: pwsh
        run: |
          go install github.com/m-lab/ndt7-client-go/cmd/ndt7-client@latest
          $env:PATH = "$(go env GOPATH)\bin;$env:PATH"
          go build -o st.exe .
          ./st.exe -compare -rounds 3 -pause 3 -data $env:RUNNER_TEMP

  windows:
    needs: [test, windows-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build SpeedTest.exe
        run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o SpeedTest.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: SpeedTest-windows
          path: SpeedTest.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SpeedTest.exe
          generate_release_notes: true
